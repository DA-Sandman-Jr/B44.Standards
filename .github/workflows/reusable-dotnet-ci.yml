name: reusable-dotnet-ci

# One CI to rule the B44 game repos: format gate, engine-free Core build,
# tests — all on a runner WITHOUT the Godot executable, which is the
# mechanical proof that the test suite stays engine-independent.
#
# Call from a game repo:
#   jobs:
#     ci:
#       uses: DA-Sandman-Jr/B44.Standards/.github/workflows/reusable-dotnet-ci.yml@<sha>
#       with:
#         core-project: MyGame.Core/MyGame.Core.csproj
#         test-project: MyGame.Tests/MyGame.Tests.csproj
#
# A repository with more than one test project lists them all, one per line:
#
#         test-project: |
#           MyGame.Tests/MyGame.Tests.csproj
#           MyGame.Core.Tests/MyGame.Core.Tests.csproj
#
# Gate every suite the repository has. Before this input accepted a list, a
# consumer with two test projects could only name one; the other built locally,
# passed locally, sat in the solution, and was never executed by CI, so a
# regression in it would have reached main green. Naming one of two is the
# failure this list exists to prevent.

on:
  workflow_call:
    inputs:
      core-project:
        description: Path to the engine-free Core csproj (game repos). Omit in non-game repos to build the solution instead.
        required: false
        type: string
        default: ''
      test-project:
        description: >-
          Path to the test csproj, or several separated by newlines. Every path
          listed is built and run; a single path behaves exactly as before.
        required: true
        type: string
      dotnet-version:
        description: SDK version for setup-dotnet
        required: false
        type: string
        default: '10.0.x'
      allow-missing-solution:
        description: >-
          Skip the format gate when the repository has no root solution. Off by
          default: a verification step that silently does nothing is worse than
          one that fails, because it reports green either way.
        required: false
        type: boolean
        default: false
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic"
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Verify formatting
        run: |
          set -euo pipefail
          # Accept .slnx as well as .sln: `dotnet new sln` emits the XML format
          # on current SDKs, so every repository created from now on has one.
          # The `|| true` matters — under `set -e`, a non-matching glob makes
          # `ls` fail and kills the step before the emptiness check below can
          # run, which made the "nothing to check" branch unreachable.
          SLN=$( { ls *.sln *.slnx 2>/dev/null || true; } | head -1 )
          if [ -z "$SLN" ]; then
            if [ "${{ inputs.allow-missing-solution }}" = "true" ]; then
              echo "No solution at repo root; allow-missing-solution is set, so the format gate is deliberately skipped."
              exit 0
            fi
            echo "::error::No solution at the repository root, so the format gate cannot run. Add one, or set allow-missing-solution: true to declare the gap on purpose."
            exit 1
          fi
          dotnet format "$SLN" --verify-no-changes

      - name: Build Core (no-Godot invariant)
        if: inputs.core-project != ''
        run: dotnet build ${{ inputs.core-project }} -c Debug -p:B44AgentSyncVerifyOnly=true

      - name: Build solution
        if: inputs.core-project == ''
        run: dotnet build -c Debug -p:B44AgentSyncVerifyOnly=true

      # Both steps below read the input through the environment rather than
      # interpolating it into the script. `${{ }}` splices the caller's string
      # into the shell source itself, so a path containing shell syntax would
      # execute; an env var is data the shell never parses.
      - name: Build test projects
        env:
          TEST_PROJECTS: ${{ inputs.test-project }}
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r project; do
            project="$(printf '%s' "$project" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$project" ] && continue
            count=$((count + 1))
            echo "::group::Build $project"
            dotnet build "$project" -c Debug -p:B44AgentSyncVerifyOnly=true
            echo "::endgroup::"
          done <<< "$TEST_PROJECTS"
          # A list that parses to nothing would make both steps silent no-ops
          # and report green, which is the same false pass allow-missing-solution
          # exists to refuse. Fail instead.
          if [ "$count" -eq 0 ]; then
            echo "::error::test-project resolved to no project paths. Pass one path, or several separated by newlines."
            exit 1
          fi
          echo "Built $count test project(s)."

      - name: Run tests
        env:
          TEST_PROJECTS: ${{ inputs.test-project }}
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            project="$(printf '%s' "$project" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$project" ] && continue
            echo "::group::Test $project"
            dotnet test "$project" -c Debug --no-build
            echo "::endgroup::"
          done <<< "$TEST_PROJECTS"
