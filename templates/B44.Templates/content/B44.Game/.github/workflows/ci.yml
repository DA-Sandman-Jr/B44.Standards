name: ci

# Format gate + engine-free Core build + tests, via the shared B44 workflow.
# Runs on a runner WITHOUT the Godot executable — the mechanical proof that the
# test suite stays engine-independent. Packages restore from nuget.org with no
# credentials.
#
# Manual by design: hosted validation is a deliberate checkpoint, not the
# development loop, so nothing here runs on push or pull request. Validate
# locally while implementing and dispatch this after a meaningful feature, an
# Epic or integration change, or before a release. A public repository, where
# standard hosted runners are free, may add push and pull_request triggers.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Pin to a reviewed SHA rather than a branch for anything you care about.
    uses: DA-Sandman-Jr/B44.Standards/.github/workflows/reusable-dotnet-ci.yml@B44_CI_REF
    with:
      core-project: GameName.Core/GameName.Core.csproj
      # One path, or several one per line. Gate every test project the
      # repository has — one this workflow never runs still passes locally and
      # still sits in the solution, so a regression in it reaches main green.
      test-project: GameName.Tests/GameName.Tests.csproj
